<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>revision</title>
</head>

<style>

*{
    text-decoration: none;
    list-style: none;
    margin: 0; box-sizing: border-box;
    padding: 0;
}

header{
    padding: 0 7%;
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    background-color: yellow;
}

header .logo{
    font-weight: bolder;
    font-size: 20px;
    color: rgb(10, 0, 0);
    position: relative;
    text-transform: uppercase;
}

header .navbar ul li{
    position: relative;
    float: left;
}

header .navbar ul li a{
    font-size: 15px;
    padding: 20px;
    color: #333;
    display: block;
}
</style>


<body>
    <header>
        <a href="" class="logo">LOGO</a>
        <nav class="navbar">
            <ul>
                <li><a href="">HOME</a></li>
                <li><a href="">HOME</a></li>
                <li><a href="">HOME</a></li>
                <li><a href="">HOME</a></li>
                <li><a href="">HOME</a></li>
            </ul>
        </nav>



    </header>
</body>
</html>
