<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision</title>
</head>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    text-transform: capitalize;
    text-decoration: none; 
    list-style: none;    
}

header{
   
   position: fixed;
   top: 0; left: 0; right: 0;
   background: rgba(233, 26, 26, 0.842);
   padding: 0px 7%;
   display: flex;
   align-items: center;
   justify-content: space-between;
   z-index: 1000;
}

header .logo{
    font-weight: bolder;
    font-size: 20px;
    color: rgb(10, 0, 0);
    position: relative;
    text-transform: uppercase;
} 

header .navbar ul li{
    position: relative;
    float: left;
}
header .navbar ul li a{
    font-size: 15px;
    padding: 20px;
    color: #333;
    display: block;
}
</style>




<body>
    <header>
        <a href="" class="logo">REVISION</a>
       <nav class="navbar">
        <ul>
            <li><a href="">HOME</a></li>
            <li><a href="">HOME</a></li>            
            <li><a href="">HOME</a></li>
            <li><a href="">HOME</a></li>
        </ul>
       </nav> 
    </header>
</body>
</html>
